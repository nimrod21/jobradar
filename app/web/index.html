<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>JobRadar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <svg class="logo-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="5.5" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5"/>
        <path d="M12 12 L20.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="2" fill="currentColor"/>
        <circle cx="16.4" cy="15.2" r="1.6" fill="currentColor"/>
      </svg>
      <span class="logo">JobRadar</span>
      <button id="theme-toggle" class="btn-quiet btn-icon" title="Toggle theme">◐</button>
    </div>

    <div class="side-label">Trackers</div>
    <nav id="tracker-list"></nav>
    <button id="new-tracker" class="side-new">+ New Tracker</button>

    <div class="side-spacer"></div>
    <div class="side-divider"></div>
    <button id="nav-applied" class="tracker-item applied-nav">
      <span class="t-name">✓ Applied</span>
      <span class="t-count" id="applied-count" hidden>0</span>
    </button>
  </aside>

  <main id="main">
    <div id="banner" hidden></div>

    <header id="topbar">
      <div class="topbar-left">
        <input id="search" type="search" placeholder="Search"
               autocomplete="off" spellcheck="false">
      </div>
      <div class="topbar-right">
        <span id="result-count"></span>
        <div id="window-chips" class="chips">
          <button class="chip" data-w="24h">24h</button>
          <button class="chip" data-w="7d">7d</button>
          <button class="chip" data-w="14d">14d</button>
          <button class="chip" data-w="30d">30d</button>
          <button class="chip" data-w="all">All</button>
        </div>
      </div>
    </header>

    <div id="content">
      <section id="results" tabindex="0"></section>
      <section id="detail"><div class="empty-pane">Select a job</div></section>
    </div>

    <div id="applied-view" hidden>
      <div class="applied-col">
        <h2>To confirm <span class="muted">— did you actually apply?</span></h2>
        <div id="applied-pending"></div>
        <h2 class="applied-done-h">Applied</h2>
        <div id="applied-done"></div>
      </div>
    </div>
  </main>
</div>

<div id="modal-backdrop" hidden>
  <div id="tracker-modal">
    <h2 id="modal-title">New Tracker</h2>
    <label>Name
      <input id="f-name" type="text" placeholder="AI engineering">
    </label>
    <label>Include Terms <span class="hint">any match · separate with commas</span>
      <div class="chip-input" id="f-include"></div>
    </label>
    <label>Search In <span class="hint">where include terms must appear</span>
      <div class="chips" id="f-searchin">
        <button class="chip active" data-s="both">Title + Description</button>
        <button class="chip" data-s="title">Title Only</button>
        <button class="chip" data-s="description">Description Only</button>
      </div>
    </label>
    <label>Exclude Terms <span class="hint">optional · separate with commas</span>
      <div class="chip-input" id="f-exclude"></div>
    </label>
    <label>Exclude Companies <span class="hint">optional · separate with commas</span>
      <div class="chip-input" id="f-exclude-co"></div>
    </label>
    <label>Window
      <div class="chips" id="f-window">
        <button class="chip" data-w="24h">24h</button>
        <button class="chip" data-w="7d">7d</button>
        <button class="chip active" data-w="14d">14d</button>
        <button class="chip" data-w="30d">30d</button>
        <button class="chip" data-w="all">All</button>
      </div>
    </label>
    <label>Work Mode <span class="hint">any of the selected · none = all jobs</span>
      <div class="chips" id="f-workmodes">
        <button class="chip" data-m="remote">Remote</button>
        <button class="chip" data-m="hybrid">Hybrid</button>
        <button class="chip" data-m="onsite">On-Site</button>
      </div>
    </label>
    <label>Location
      <select id="f-locmode">
        <option value="any">Anywhere</option>
        <option value="region">Region…</option>
        <option value="country">Country…</option>
        <option value="place">City or keyword…</option>
      </select>
    </label>
    <label id="f-locvalue-wrap" hidden><span id="f-locvalue-label"></span>
      <span class="hint" id="f-locvalue-hint" hidden>any match · separate with commas · checked against location, title and description</span>
      <input id="f-locvalue" type="text" hidden>
      <select id="f-locregion" hidden>
        <option value="emea">EMEA / Europe</option>
        <option value="apac">APAC</option>
        <option value="latam">LATAM</option>
        <option value="north-america">North America</option>
        <option value="middle-east">Middle East</option>
        <option value="africa">Africa</option>
        <option value="caucasus">Caucasus</option>
        <option value="global">Global — explicitly worldwide</option>
      </select>
    </label>
    <div class="modal-actions">
      <span id="f-delete" class="danger-link" hidden>Delete Tracker</span>
      <span class="flex-spacer"></span>
      <button id="f-cancel" class="btn-quiet">Cancel</button>
      <button id="f-save" class="btn-primary">Save Tracker</button>
    </div>
  </div>
</div>

<div id="ctx-menu" hidden></div>

<script src="app.js"></script>
</body>
</html>
